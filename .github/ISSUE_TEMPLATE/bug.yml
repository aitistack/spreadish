name: Bug report
description: Report a reproducible bug
body:
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: Minimal reproducible example
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true
