name: Benchmark

on:
    pull_request:
        branches: [main, development]
    push:
        branches: [main, development]

jobs:
    benchmark:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run benchmark
