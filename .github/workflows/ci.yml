name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    community:
        runs-on: ubuntu-latest
        outputs:
            monorepo: ${{ steps.detect.outputs.monorepo }}
        steps:
            - uses: actions/checkout@v6
            - id: detect
              name: Detect monorepo
              run: |
                  if [ -f package.json ]; then
                    echo "monorepo=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "monorepo=false" >> "$GITHUB_OUTPUT"
                    test -f README.md
                    test -f CONTRIBUTING.md
                    test -f SECURITY.md
                    test -f LICENSE
                    echo "Community files present."
                  fi

    validate:
        needs: community
        if: needs.community.outputs.monorepo == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            # Workspace package.json exports resolve to dist/; build before Bun tests.
            - run: bun run build
            - run: bun run test:unit
            - run: bun run test:coverage
            - run: bun run check:circular
            - run: bun run package:check
            - run: bun run package:smoke
            - run: bun run bundle:report
            - run: bun run audit:deps
            - run: bun run benchmark
