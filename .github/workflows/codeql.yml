name: CodeQL

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]
    schedule:
        - cron: '30 3 * * 1'

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v6

            - uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript

            - uses: github/codeql-action/autobuild@v4

            # Private repos need GitHub Advanced Security for code scanning uploads.
            # Keep analysis useful locally in CI without failing the branch gate.
            - uses: github/codeql-action/analyze@v4
              continue-on-error: true
              id: analyze
            - name: Code scanning availability
              if: steps.analyze.outcome == 'failure'
              run: |
                  echo "::warning::CodeQL analyze failed (often because Advanced Security / code scanning is not enabled). Treating as non-blocking."
