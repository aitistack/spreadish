name: E2E

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    playwright:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run e2e:install
            - run: bun run build
            # Build docs as its own step so failures are visible in the job log.
            # Playwright then only starts the preview server (see playwright.config.ts).
            - run: bun run build:docs
            - run: bun run test:e2e
              env:
                  E2E_DOCS_PREBUILT: '1'
